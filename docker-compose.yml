services:

  postgres:
    image: postgres:17
    container_name: enterprise-agent-postgres
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_password
      POSTGRES_DB: agent_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: enterprise-agent-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agent_user:agent_password@postgres:5432/agent_platform
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis


volumes:
  postgres_data: